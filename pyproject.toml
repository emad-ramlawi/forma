[project]
name = "forma-linux"
version = "0.1.6"
description = "Local Linux PDF form filling and handwritten signatures"
requires-python = ">=3.14"
dependencies = [
    "reportlab==5.0.1",
    "pypdf[crypto]==6.19.0",
    "pyhanko==0.37.0",
]

[dependency-groups]
dev = ["pyinstaller==6.22.3", "playwright==1.63.0", "pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
